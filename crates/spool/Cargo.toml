[package]
name = "spool"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
spool-core = { path = "../spool-core" }
spool-nntp = { path = "../spool-nntp" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
parking_lot = "0.12"
rust-embed = "8"
mime_guess = "2"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
urlencoding = "2"
async-trait = "0.1"
libc = "0.2"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
spool-nntp = { path = "../spool-nntp", features = ["testing"] }
tempfile = "3"
