[package]
name = "spool"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
spool-core = { path = "../spool-core" }
spool-nntp = { path = "../spool-nntp" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "multipart", "stream"] }
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
parking_lot = "0.12"
rust-embed = "8"
mime_guess = "2"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
urlencoding = "2"
async-trait = "0.1"
libc = "0.2"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
ring = "0.17"
base64 = "0.22"
tokio-util = { version = "0.7", features = ["io"] }
spake2 = "0.4"
if-addrs = "0.15"
socket2 = "0.6"
ab_glyph = "0.2"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
unicode-normalization = "0.1"
# Books: the search index of Anna's Archive, the torrent its metadata comes in, and reading EPUBs.
tantivy = "0.22"
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
deunicode = "1.6"
strsim = "0.11"
md-5 = "0.10"
memchr = "2"
lofty = "0.25.5"

# On a Mac the model for finding what is said runs on the graphics chip.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal", "accelerate"] }
candle-nn = { version = "0.11", features = ["metal", "accelerate"] }
candle-transformers = { version = "0.11", features = ["metal", "accelerate"] }

[dev-dependencies]
spool-nntp = { path = "../spool-nntp", features = ["testing"] }
tempfile = "3"
