# Spool with Docker Compose. Also the shape to use for a custom app on TrueNAS SCALE,
# Unraid and similar.
#
# Put the library and the downloads folder under ONE mount (here /media), so a finished
# download is moved into the library instantly instead of being copied.
#
# For a NAS that only holds part of the library while Spool runs elsewhere, see
# deploy/helper.compose.yaml and docs/helper.md.
services:
  spool:
    build: .
    # image: ghcr.io/rewtraw/spool:latest
    container_name: spool
    restart: unless-stopped
    # Run as the user that owns the media. On TrueNAS SCALE the apps user is 568:568.
    user: "1000:1000"
    ports:
      - "7979:7979"
      # For players such as Infuse, once turned on under Settings, General, Players.
      # Give the player this machine's address and port 8096; being found without an address
      # needs the container to share the host's network.
      # - "8096:8096"
    volumes:
      - ./data:/data
      - /path/to/media:/media
    environment:
      TZ: Etc/UTC
